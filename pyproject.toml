[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oddsfox-market-semantics"
version = "0.1.0"
description = "Offline evidence-backed cross-venue election market semantics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["pyarrow>=19,<25"]

[project.scripts]
market-semantics = "market_semantics.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-timeout>=2.3,<3", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/market_semantics"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "README.md", "SPEC.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "--import-mode=importlib"
