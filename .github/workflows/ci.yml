name: verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
      UV_LINK_MODE: copy
      POLYMARKET_EVENTS_SOURCE: ${{ github.workspace }}/.interop/polymarket-events
      KALSHI_EVENTS_SOURCE: ${{ github.workspace }}/.interop/kalshi-events
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TheOddsFox/polymarket-events
          ref: bd5eb0c1af1e40295305b6558d9ea28d1f1ce5fa
          path: .interop/polymarket-events
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TheOddsFox/kalshi-events
          ref: 8b0c04b0e2c5d96edec14b525f483ccfdff66134
          path: .interop/kalshi-events
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Locked dependencies
        run: uv lock --check && uv sync --locked
      - name: Lint and format
        run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - name: Tests including publication and recovery
        run: uv run --locked pytest -q
      - name: Build and audit public distributions
        run: uv build && uv run --locked python scripts/check-distributions.py
      - name: Installed producer and consumer handoff
        run: uv run --locked python scripts/check-installed.py
